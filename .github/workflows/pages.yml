# Builds the website (packages/site) with the newest test results and
# publishes it to GitHub Pages. To use this workflow, set the Pages source of
# the repository to "GitHub Actions" (Settings > Pages).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # To download the newest report of the mutation workflow
  actions: read

# One deployment at a time. A newer push cancels a deployment that waits.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The browser tests of each engine on its own runner, one project at a time, as the
  # browser jobs of ci.yml do. The timing tests measure milliseconds, and a runner has
  # few CPUs: with all the engines in one job, the I/O of a Firefox worker did not
  # complete during a block of 2 s (experiment E6) in 7 of 41 runs. Each job exports its
  # reports, and the build job adds them to the run of the site. The project lists are
  # the same as in ci.yml (packages/scripts/src/results/browser-projects.test.ts).
  browser:
    name: Results, browser tests (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Chrome stable is on the runner image: the "chrome" channel uses it
          - engine: chromium
            playwright: chromium
            projects: '["browser (chromium)", "browser (chrome)", "cdp", "bfcache", "coi (chromium)"]'
          - engine: firefox
            playwright: firefox
            projects: '["browser (firefox)", "coi (firefox)"]'
          - engine: webkit
            playwright: webkit
            projects: '["browser (webkit)", "coi (webkit)"]'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the Playwright browser and its system dependencies
        run: pnpm --filter @lag/integration-tests exec playwright install --with-deps ${{ matrix.playwright }}
      - name: Browser tests
        continue-on-error: true
        env:
          PROJECTS: ${{ matrix.projects }}
        run: pnpm results --skip-unit --skip-overhead --skip-site --no-mutation "--projects=$PROJECTS" --export-reports=reports
      - uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.engine }}
          path: reports/
          if-no-files-found: ignore

  # The browser tests in the real Safari. Only macOS has Safari. As in ci.yml, no iOS
  # Simulator operates on this runner: a simulator that boots uses the CPU of the Mac
  # for minutes, and Safari then slowed the timers and the frames of the test page.
  safari:
    name: Results, browser tests (safari)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Enable safaridriver
        run: sudo safaridriver --enable
      # App Nap of macOS slows the timers of a window that is not in front: a CI runner
      # slowed the timers of Safari by 9 s one time
      - name: Turn off App Nap
        run: |
          defaults write com.apple.Safari NSAppSleepDisabled -bool YES
          defaults write NSGlobalDomain NSAppSleepDisabled -bool YES
      - name: Browser tests in Safari
        continue-on-error: true
        # caffeinate keeps the display awake: WebKit slows the timers of a window that it does not show
        run: |
          caffeinate -dimsu -t 3600 &
          pnpm results --skip-unit --skip-browser --skip-overhead --skip-site --no-mutation --safari --export-reports=reports
      - uses: actions/upload-artifact@v4
        with:
          name: reports-safari
          path: reports/
          if-no-files-found: ignore

  # Safari on iOS in the iOS Simulator of its own macOS runner, as in ci.yml
  ios:
    name: Results, browser tests (Safari on iOS, simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Without a simulator, the iOS tests fail, and the exit code of their step goes to the run of the site
      - name: Boot an iPhone simulator
        continue-on-error: true
        run: .github/scripts/boot-ios-simulator.sh
      - name: Enable safaridriver
        run: sudo safaridriver --enable
      # After a lost WebDriver session without a failed test, the collector operates the iOS tests a
      # second time, as the CI job does (packages/scripts/src/results/session-loss.ts)
      - name: Browser tests in Safari on iOS
        continue-on-error: true
        run: pnpm results --skip-unit --skip-browser --skip-overhead --skip-site --no-mutation --ios --export-reports=reports
      - uses: actions/upload-artifact@v4
        with:
          name: reports-ios
          path: reports/
          if-no-files-found: ignore

  build:
    # The site also builds when a browser job fails
    needs: [browser, safari, ios]
    if: always()
    runs-on: ubuntu-latest
    # The build installs and runs the code of the repository, so it gets only read permissions.
    permissions:
      contents: read
      # The mutation report step reads the Actions runs. site-pages reads the pull requests, the issues and their checks.
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: site-pages reads the dates of the tags and of the changelog headings
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The browser jobs above test the engines. This job operates the overhead benchmark, which uses Chromium
      - name: Install Chromium for the overhead benchmark
        run: pnpm --filter @lag/integration-tests exec playwright install --with-deps chromium

      # The weekly mutation workflow uploads its report, also when the score is below the
      # break threshold (if: always()). Thus this step takes the newest completed run of main,
      # not only a successful run: a score that falls must show on the site. A run without
      # the artifact (for example a run that stopped before Stryker) does not count.
      # mutation-run.json gives pnpm results the commit and the time of the Stryker run.
      - name: Download the newest mutation report of main
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          dir=packages/lag/reports/mutation
          gh run list --workflow mutation.yml --branch main --status completed --limit 10 \
            --json databaseId,headSha,createdAt,conclusion \
            --jq '.[] | [.databaseId, .headSha, .createdAt, .conclusion] | @tsv' |
          while IFS=$'\t' read -r run_id commit created conclusion; do
            if gh run download "$run_id" --name mutation-report --dir "$dir"; then
              printf '{"commit":"%s","createdAt":"%s"}\n' "$commit" "$created" > "$dir/mutation-run.json"
              echo "Mutation report of run $run_id ($conclusion) for $commit from $created"
              break
            fi
          done

      # One folder for each browser job: browser-reports/reports-chromium, browser-reports/reports-safari, ...
      - name: Download the reports of the browser jobs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: reports-*
          path: browser-reports

      # The results viewer of the site reads packages/site/public/data/results
      # Failed tests do not stop the deploy: the site shows them
      - name: Make the test results
        run: pnpm results --skip-browser --import-reports=browser-reports
        continue-on-error: true

      # A crash of the collector must not deploy a site without results, as a green run
      - name: The test results exist
        shell: bash
        run: |
          index=packages/site/public/data/results/index.json
          if [ ! -s "$index" ]; then
            echo "::error::The collector wrote no $index. Thus the site would deploy without test results."
            exit 1
          fi
          node -e 'const i = require("./" + process.argv[1]); if (!Array.isArray(i.runs) || i.runs.length === 0) { console.error("index.json has no runs"); process.exit(1); }' "$index"

      # The site build renders each page and each Open Graph image in Chromium. The step above
      # installed the browsers of the integration tests; this step installs the Chromium of the
      # Playwright version of the site, if the versions are not the same.
      - name: Install Chromium for the site build
        run: pnpm --filter @lag/site exec playwright install chromium

      - name: Build the site
        run: pnpm --filter @lag/site build
        env:
          SITE_BASE: ${{ github.event.repository.name }}
          # The absolute URL of the site, for the canonical links, Open Graph and the sitemap
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      # The Releases page and the Status page (releases/, status/ and their data/*.json), at deploy time
      - uses: mark1russell7/template/.github/actions/site-pages@e95097e2153264ebb994e2979281844a546e296c # main
        with:
          out: packages/site/dist
          packages: "@mark1russell7/lag"
          site-name: lag

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
