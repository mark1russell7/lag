name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, typecheck, unit tests, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm coverage
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: packages/lag/coverage/
          if-no-files-found: ignore
      # The writing rules (ASD-STE100) of the README, the site and the comments
      - name: STE lint
        run: pnpm lint:ste
      # The metric table of the README must agree with the metric catalog
      - name: README metric table
        run: pnpm readme:metrics:check

  browser:
    name: Browser tests (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Chrome stable is on the runner image: the "chrome" channel uses it
          - engine: chromium
            playwright: chromium
            projects: '["browser (chromium)", "browser (chrome)", "cdp", "coi (chromium)"]'
          - engine: firefox
            playwright: firefox
            projects: '["browser (firefox)", "coi (firefox)"]'
          - engine: webkit
            playwright: webkit
            projects: '["browser (webkit)", "coi (webkit)"]'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the Playwright browser and its system dependencies
        working-directory: packages/lag-integration-tests
        run: pnpm exec playwright install --with-deps ${{ matrix.playwright }}
      # One project at a time: the timing tests measure milliseconds, and the runner has few CPUs
      - name: Browser tests
        working-directory: packages/lag-integration-tests
        env:
          PROJECTS: ${{ matrix.projects }}
        shell: bash
        run: |
          mapfile -t projects < <(node -e 'for (const p of JSON.parse(process.env.PROJECTS)) console.log(p)')
          status=0
          for project in "${projects[@]}"; do
            echo "::group::$project"
            pnpm exec vitest run --project "$project" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Upload the failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.engine }}
          path: packages/lag-integration-tests/src/**/__screenshots__/
          if-no-files-found: ignore

  # The real Safari, through safaridriver. Only macOS has it. The job reports, but it does not
  # block: Safari on a shared macOS runner sometimes slows the timers of its window (by 9 s one
  # time), and then a timing test fails for a reason that is not in the code.
  safari:
    name: Browser tests (safari)
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Show the version of Safari
        run: defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString
      # safaridriver needs a one-time permission for remote automation
      - name: Enable safaridriver
        run: sudo safaridriver --enable
      # App Nap of macOS slows the timers of a window that is not in front: a CI runner
      # slowed the timers of Safari by 9 s one time
      - name: Turn off App Nap
        run: |
          defaults write com.apple.Safari NSAppSleepDisabled -bool YES
          defaults write NSGlobalDomain NSAppSleepDisabled -bool YES
      - name: Browser tests in Safari
        working-directory: packages/lag-integration-tests
        # caffeinate keeps the display awake: WebKit slows the timers of a window that it does not show
        run: |
          caffeinate -dimsu -t 3600 &
          pnpm run test:safari

  # Safari on iOS in the iOS Simulator of a macOS runner, through safaridriver. The job reports,
  # but it does not block: a simulator has the CPU and the power of the Mac, not of a phone, and
  # its first page can take more than 60 s to open.
  ios:
    name: Browser tests (Safari on iOS, simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Show Xcode and the iOS runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS
      - name: Boot an iPhone simulator
        run: .github/scripts/boot-ios-simulator.sh
      # safaridriver needs a one-time permission for remote automation
      - name: Enable safaridriver
        run: sudo safaridriver --enable
      - name: Browser tests in Safari on iOS
        working-directory: packages/lag-integration-tests
        run: pnpm run test:ios

  site:
    name: Site typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium for the browser tests of the site
        working-directory: packages/site
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter @lag/site typecheck
      - run: pnpm --filter @lag/site test
      - run: pnpm --filter @lag/site build
