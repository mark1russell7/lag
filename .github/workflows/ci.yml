name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:
  # A person starts a run on a branch with no pull request: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # The shared CI of the template (CI.md of mark1russell7/template) starts the scripts of package.json in this
  # sequence: the conventions, the build, the API report, the typecheck, the unit tests, the coverage with its floors,
  # the STE lint and the README metric table. Each job of the browsers and of the site stays below.
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@4466542421ef76bcb3ccf5b5e1765d4f509f8f4f # main
    with:
      scripts: check:conventions build check:api typecheck test coverage lint:ste readme:metrics:check
      node-versions: '["24"]'
      timeout-minutes: 20

  # The rules of main require this check by its name. It passes only when each job of the shared CI passed.
  build:
    name: Build, typecheck, unit tests, coverage
    if: ${{ !cancelled() }}
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@4466542421ef76bcb3ccf5b5e1765d4f509f8f4f # main
        with:
          needs: ${{ toJSON(needs) }}

  browser:
    name: Browser tests (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        include:
          # Chrome stable is on the runner image: the "chrome" channel uses it
          - engine: chromium
            playwright: chromium
            projects: '["browser (chromium)", "browser (chrome)", "cdp", "bfcache", "coi (chromium)"]'
          - engine: firefox
            playwright: firefox
            projects: '["browser (firefox)", "coi (firefox)"]'
          - engine: webkit
            playwright: webkit
            projects: '["browser (webkit)", "coi (webkit)"]'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install the Playwright browser and its system dependencies
        uses: mark1russell7/template/.github/actions/setup-playwright@4466542421ef76bcb3ccf5b5e1765d4f509f8f4f # main
        with:
          browsers: ${{ matrix.playwright }}
          command: pnpm exec playwright
          working-directory: packages/lag-integration-tests
      # One project at a time: the timing tests measure milliseconds, and the runner has few CPUs
      - name: Browser tests
        working-directory: packages/lag-integration-tests
        env:
          PROJECTS: ${{ matrix.projects }}
        shell: bash
        run: |
          mapfile -t projects < <(node -e 'for (const p of JSON.parse(process.env.PROJECTS)) console.log(p)')
          status=0
          for project in "${projects[@]}"; do
            echo "::group::$project"
            pnpm exec vitest run --project "$project" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Upload the failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-${{ matrix.engine }}
          path: packages/lag-integration-tests/src/**/__screenshots__/
          if-no-files-found: ignore

  # The real Safari, through safaridriver. Only macOS has it. Safari on a shared macOS runner
  # sometimes slows the timers of its window (by 9 s one time), and then a timing test fails for a
  # reason that is not in the code. The rules of main require this check, so a failure blocks a pull
  # request, even with continue-on-error.
  safari:
    name: Browser tests (safari)
    runs-on: macos-latest
    # The reads take approximately 16 min. The job took 23 min on 2026-11-05, before the scroll arm of the repaint read.
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Show the version of Safari
        run: defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString
      # safaridriver needs a one-time permission for remote automation
      - name: Enable safaridriver
        run: sudo safaridriver --enable
      # App Nap of macOS slows the timers of a window that is not in front: a CI runner
      # slowed the timers of Safari by 9 s one time
      - name: Turn off App Nap
        run: |
          defaults write com.apple.Safari NSAppSleepDisabled -bool YES
          defaults write NSGlobalDomain NSAppSleepDisabled -bool YES
      - name: Browser tests in Safari
        working-directory: packages/lag-integration-tests
        shell: bash
        # caffeinate keeps the display awake: WebKit slows the timers of a window that it does not show
        run: |
          caffeinate -dimsu -t 3600 &
          pnpm run test:safari 2>&1 | tee "$RUNNER_TEMP/safari-tests.log"
      # A read with no check: the chain of 5 ms timers over time, on a page with no load, in a new session.
      - name: Read the grid of the timers over time
        if: always()
        continue-on-error: true
        working-directory: packages/lag-integration-tests
        shell: bash
        run: |
          caffeinate -dimsu -t 600 &
          LAG_SAFARI=1 LAG_SAFARI_READ=1 pnpm exec vitest run --project "browser (safari)"
      # The same read on a page with focus: one real click, then no input and no load, in a new session.
      - name: Read the grid of the timers on a page with focus
        if: always()
        continue-on-error: true
        working-directory: packages/lag-integration-tests
        shell: bash
        run: |
          caffeinate -dimsu -t 600 &
          LAG_SAFARI=1 LAG_SAFARI_READ=focus pnpm exec vitest run --project "browser (safari)"
      # The same read with a real click each 20 s: is it the time since the last input, or since the page loaded?
      - name: Read the grid of the timers on a page with input
        if: always()
        continue-on-error: true
        working-directory: packages/lag-integration-tests
        shell: bash
        run: |
          caffeinate -dimsu -t 600 &
          LAG_SAFARI=1 LAG_SAFARI_READ=input pnpm exec vitest run --project "browser (safari)"
      # Three arms: a repaint each 20 s with no input, a click each 20 s with no repaint, and a scroll each 20 s
      # with no change of the document. The change clock of lag operates in each arm.
      - name: Read the grid of the timers with a repaint, and with an input that does not repaint
        if: always()
        continue-on-error: true
        working-directory: packages/lag-integration-tests
        shell: bash
        run: |
          caffeinate -dimsu -t 900 &
          LAG_SAFARI=1 LAG_SAFARI_READ=repaint pnpm exec vitest run --project "browser (safari)"
      # A skip of the load cases keeps this job green. It is no read, so the check and the summary say so.
      - name: Report a no read of the load cases
        if: always()
        shell: bash
        run: |
          safari=$(defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString)
          echo "Safari $safari, macOS $(sw_vers -productVersion), image $ImageOS $ImageVersion"
          pmset -g | grep -iE "lowpowermode|displaysleep" || true
          log="$RUNNER_TEMP/safari-tests.log"
          [ -f "$log" ] || exit 0
          count=$(grep -c "drift-load cannot decide" "$log" || true)
          [ "$count" -gt 0 ] || exit 0
          message="no read: $count load cases of drift-load in Safari $safari, image $ImageOS $ImageVersion. This green job is not a read of these cases."
          echo "::warning title=No read of the load cases::$message"
          {
            echo "### No read of the load cases"
            echo
            echo "$message"
          } >> "$GITHUB_STEP_SUMMARY"

  # Safari on iOS in the iOS Simulator of a macOS runner, through safaridriver. The job reports,
  # but it does not block: a simulator has the CPU and the power of the Mac, not of a phone, and
  # its first page can take more than 60 s to open.
  ios:
    name: Browser tests (Safari on iOS, simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Show Xcode and the iOS runtimes
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS
      - name: Boot an iPhone simulator
        run: .github/scripts/boot-ios-simulator.sh
      # safaridriver needs a one-time permission for remote automation
      - name: Enable safaridriver
        run: sudo safaridriver --enable
      # Safari in the simulator sometimes closes its WebDriver session in the middle of a file. Then the
      # script operates the tests a second time, with a warning, but only if no test failed
      - name: Browser tests in Safari on iOS
        working-directory: packages/lag-integration-tests
        run: ../../.github/scripts/test-ios.sh

  site:
    name: Site typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The browser tests of the site and the prerender of the site build use Chromium. The shared action
      # installs it from a cache, with a time limit and a second try.
      - name: Install Chromium for the site
        uses: mark1russell7/template/.github/actions/setup-playwright@4466542421ef76bcb3ccf5b5e1765d4f509f8f4f # main
        with:
          browsers: chromium
          command: pnpm exec playwright
          working-directory: packages/site
      - run: pnpm --filter @lag/site typecheck
      - run: pnpm --filter @lag/site test
      - name: Build the site, as the Pages workflow does
        run: pnpm --filter @lag/site build
        env:
          SITE_BASE: lag
          SITE_URL: https://mark1russell7.github.io/lag/
      # The HTML of each page must contain the text of the page, the head tags and the image
      - name: The prerendered pages are complete
        shell: bash
        run: |
          page=packages/site/dist/docs/getting-started.html
          grep -q '<h1[^>]*>Quick start</h1>' "$page"
          grep -q '<link rel="canonical" href="https://mark1russell7.github.io/lag/docs/getting-started" />' "$page"
          grep -q '"@type":"TechArticle"' "$page"
          test -s packages/site/dist/og/docs/getting-started.png
          grep -q '<loc>https://mark1russell7.github.io/lag/docs/getting-started</loc>' packages/site/dist/sitemap.xml
          grep -q 'content="noindex"' packages/site/dist/404.html
