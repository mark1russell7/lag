name: Mutation testing

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Test all mutants again (--force), without the results of the incremental file"
        type: boolean
        default: false
  schedule:
    # Every Sunday at 03:41 UTC
    - cron: "2 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  stryker:
    name: Stryker on @mark1russell7/lag
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Incremental mode: Stryker tests again only the mutants whose code or tests changed.
      # A run takes the newest file of its own branch, or else the newest file of main. The
      # file of another branch can keep the result of a mutant that is not true on this
      # branch (a stale kill). The run ID in the key lets each run save its own file.
      - name: Restore the incremental file
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/lag/reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ github.ref_name }}-
            stryker-incremental-main-
      # The weekly run tests all mutants again (--force) and writes a new incremental file.
      # Thus a stale result stays for one week at most. A manual run stays incremental and fast,
      # unless its input force is true. The incremental file can also keep a stale "survived":
      # a mutant that operates when a module loads has no covering tests in the report, thus
      # Stryker keeps its old result when the tests change. Use force for numbers to publish.
      - name: Stryker
        run: pnpm --filter @mark1russell7/lag run mutation ${{ (github.event_name == 'schedule' || inputs.force) && '--force' || '' }}
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report
          path: packages/lag/reports/mutation/
          if-no-files-found: ignore
