name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    # Every Sunday at 03:41 UTC
    - cron: "41 3 * * 0"

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker on @lag/core
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Incremental mode: Stryker tests again only the mutants whose code or tests changed.
      # A run takes the newest file of its own branch, or else the newest file of main. The
      # file of another branch can keep the result of a mutant that is not true on this
      # branch (a stale kill). The run ID in the key lets each run save its own file.
      - name: Restore the incremental file
        uses: actions/cache@v4
        with:
          path: packages/lag/reports/stryker-incremental.json
          key: stryker-incremental-${{ github.ref_name }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ github.ref_name }}-
            stryker-incremental-main-
      # The weekly run tests all mutants again (--force) and writes a new incremental file.
      # Thus a stale kill stays for one week at most. A manual run stays incremental and fast.
      - name: Stryker
        run: pnpm --filter @lag/core run mutation ${{ github.event_name == 'schedule' && '--force' || '' }}
      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: packages/lag/reports/mutation/
          if-no-files-found: ignore
