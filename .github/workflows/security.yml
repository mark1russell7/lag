# The security scans of this repository (the action security-scan, CI.md of mark1russell7/template):
# dependency review, osv-scanner and CodeQL, in one job. A pull request fails only for a new finding at
# or above high. Pushes to main and the weekly scan upload the findings to the Security tab.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The scans run in one job, so a run asks for one runner (the rule security-one-job).
  security-ok:
    name: Security OK
    runs-on: ubuntu-latest
    # The time limit of the three scans together
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: mark1russell7/template/.github/actions/security-scan@ddf7e495fc88b536e2ea89bb8271ac2d50b28baf # main
