# The security scans of this repository: dependency review, osv-scanner and CodeQL (CI.md of
# mark1russell7/template). A pull request fails only for a new finding at or above high. Pushes to
# main and the weekly scan upload the findings to the Security tab.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "31 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    uses: mark1russell7/template/.github/workflows/reusable-security.yml@ed0b3ebc9cd89b78c880fb7af9f6b09392a383f7 # main
    permissions:
      contents: read
      security-events: write
      actions: read
